spring:
  application:
    name: Warehouse_Optimization
  config:
    import: optional:configtree:/run/secrets/
  profiles:
    default: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://warehouse-postgressql.postgres.database.azure.com:5432/postgres?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:super_admin}
    password: ${db_password:${SPRING_DATASOURCE_PASSWORD:secret}}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
