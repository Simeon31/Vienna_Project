services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/warehouse_optimization'
      - 'SPRING_DATASOURCE_USERNAME=warehouse'
      - 'SPRING_DATASOURCE_PASSWORD=secret'
      - 'SPRING_PROFILES_ACTIVE=prod'
      - 'APP_CORS_ALLOWED_ORIGINS=http://localhost:3000'
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - '3000:80'
    depends_on:
      - server

  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=warehouse_optimization'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=warehouse'
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U warehouse -d warehouse_optimization']
      interval: 5s
      timeout: 5s
      retries: 10
