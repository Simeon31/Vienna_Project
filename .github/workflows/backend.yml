name: Backend CI
on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'          # Only triggers when server directory changes are present
      - 'compose.yaml'
  pull_request:
    paths:
      - 'server/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
      - name: Run Tests with Gradle
        run: ./gradlew test
        working-directory: ./server
