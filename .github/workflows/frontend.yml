name: Frontend CI
on:
  push:
    branches: [ main ]
    paths:
      - 'client/**'          # Only triggers when client directory changes are present
  pull_request:
    paths:
      - 'client/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
        working-directory: ./client
      - name: Run linter and Run build
        run: npm run lint && npm run build
        working-directory: ./client
